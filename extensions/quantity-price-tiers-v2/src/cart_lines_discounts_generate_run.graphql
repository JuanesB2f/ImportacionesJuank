query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          precioEmprendedor: metafield(
            namespace: "importacionesjuank"
            key: "precio_emprendedor"
          ) {
            value
          }
          precioMayorista: metafield(
            namespace: "importacionesjuank"
            key: "precio_mayorista"
          ) {
            value
          }
          precioDistribuidor: metafield(
            namespace: "importacionesjuank"
            key: "precio_distribuidor"
          ) {
            value
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
